<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiddos - Edição</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="kiddos-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="text-kiddos-blue fw-bold m-0">Editar nome de usuário</h5>
            <button class="btn-close"></button>
        </div>

        <div class="alert alert-success d-flex align-items-center" role="alert">
            <div>
                <strong>Perfil atualizado com sucesso!</strong><br>
                <small>Seu novo nome já aparece no perfil.</small>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Nome de usuário *</label>
            <input type="text" class="form-control" value="leo_mestre_da_soma">
            <div class="form-text">Use de 4 a 20 caracteres, sem espaços. Você poderá trocar novamente depois.</div>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button class="btn btn-light w-50 fw-bold">Cancelar</button>
            <button class="btn btn-kiddos w-50">Salvar alterações</button>
        </div>
    </main>
</body>

</html>
