<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiddos - Erro de E-mail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="kiddos-card text-center">
        <h4 class="text-kiddos-blue fw-bold mb-3">E-mail não encontrado</h4>
        <p class="text-muted mb-4">Hmm... este e-mail ainda não faz parte da turma Kiddos. Confira se digitou
            direitinho.</p>

        <div class="alert alert-danger text-start mb-4" role="alert">
            <strong>E-mail não cadastrado</strong><br>
            <small>Tente outro e-mail ou peça ajuda ao seu responsável.</small>
        </div>

        <div class="mb-4 text-start">
            <label class="form-label fw-bold">E-mail de Cadastro</label>
            <input type="email" class="form-control border-danger" value="leo_novo@exemplo.com">
            <div class="text-danger small mt-1">Não encontramos uma conta com este e-mail.</div>
        </div>

        <button class="btn btn-kiddos mb-3">Tentar novamente</button>
        <a href="#" class="text-decoration-none text-muted fw-bold d-block">← Voltar ao Login</a>
    </main>
</body>

</html>
