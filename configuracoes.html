<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiddos - Configurações</title>
    <!-- Integração do Bootstrap conforme o guia da disciplina[cite: 51] -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="kiddos-card">
        <h3 class="text-kiddos-blue mb-1">Configurações</h3>
        <p class="text-muted small mb-4">Deixe sua aventura do jeitinho que você gosta.</p>

        <div class="mb-4">
            <h6 class="fw-bold"><i class="bi bi-person"></i> Conta</h6>
            <div class="bg-light-gray d-flex justify-content-between align-items-center mb-2">
                <span>Nome de usuário <br><small class="text-muted">@leo_explorador</small></span>
                <button class="btn btn-sm btn-outline-secondary">Editar</button>
            </div>
            <div class="bg-light-gray d-flex justify-content-between align-items-center mb-2">
                <span>E-mail da conta <br><small class="text-muted">leo_explorador@eduplay.com</small></span>
                <button class="btn btn-sm btn-outline-secondary">Alterar</button>
            </div>
        </div>

        <div class="mb-4">
            <h6 class="fw-bold"><i class="bi bi-bell"></i> Notificações</h6>
            <div class="form-check form-switch bg-light-gray d-flex justify-content-between align-items-center mb-2">
                <label class="form-check-label" for="notif1">Novos desafios</label>
                <input class="form-check-input" type="checkbox" id="notif1" checked>
            </div>
        </div>

        <button class="btn text-danger w-100 fw-bold">Sair da conta</button>
    </main>
</body>

</html>
