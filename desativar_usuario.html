<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiddos - Desativar Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Modal Centralizado usando classes utilitárias do Bootstrap[cite: 57] -->
    <main class="kiddos-card text-center border border-danger border-2">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="text-kiddos-blue fw-bold m-0">Desativar este usuário?</h5>
            <button class="btn-close"></button>
        </div>

        <p class="text-muted text-start mb-4">
            Você está prestes a desativar <strong>Mariana Alves (mari_astronoma@eduplay.com)</strong>. Ela não poderá
            entrar até ser reativada.<br><br>
            O progresso e as pontuações serão preservados.
        </p>

        <div class="d-flex gap-2">
            <button class="btn btn-light w-50 fw-bold">Cancelar</button>
            <button class="btn btn-danger w-50 fw-bold">Confirmar desativação</button>
        </div>
    </main>
</body>

</html>
